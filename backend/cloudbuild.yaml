substitutions:
  _REGION: australia-southeast1
  _REPO: opsflow

steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
      - .

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
    waitFor: [build-backend]

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - opsflow-backend
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
      - --region=${_REGION}
      # Slack's webhook handler acks in <3s and keeps processing (LLM calls,
      # DB writes, the reply post-back) in the background afterward — without
      # always-on CPU, Cloud Run freezes that background work the instant the
      # ack response is sent, since no request is left in flight to keep the
      # container's CPU allocated.
      - --no-cpu-throttling
      - --quiet
    waitFor: [push-backend]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
