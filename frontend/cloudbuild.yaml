substitutions:
  _REGION: australia-southeast1
  _REPO: opsflow

steps:
  # NEXT_PUBLIC_API_URL is baked in at build time, so this reads the
  # backend's already-deployed URL (stable across deploys, doesn't require
  # the backend trigger to have just run) rather than deploying it here.
  - id: get-backend-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe opsflow-backend --region=${_REGION} --format="value(status.url)" > /workspace/backend_url.txt

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$$(cat /workspace/backend_url.txt)
        docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=$${BACKEND_URL}/api/v1 -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA .
    waitFor: [get-backend-url]

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA
    waitFor: [build-frontend]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - opsflow-frontend
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA
      - --region=${_REGION}
      - --quiet
    waitFor: [push-frontend]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
